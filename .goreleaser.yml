version: 2

project_name: tacli

before:
  hooks:
    - bash -c "cd tacli && go mod tidy"

builds:
  - main: .
    dir: tacli
    binary: tacli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/antimatter-studios/teamagentica/tacli/internal/cli.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Deliberately no Homebrew section here.
#
# This used to publish a cask by writing straight into
# antimatter-studios/homebrew-tap with a token that had write access to it. That
# tap now reads each project's public releases, computes the checksum of the asset
# it actually downloaded, and has a person merge the result — so nothing automated
# can change what `brew install` fetches. See antimatter-studios/homebrew-tap#25.
#
# `Formula/tacli.rb` is therefore maintained in the tap, and it is a formula rather
# than a cask because the cask this replaced was broken on Linux: Homebrew
# quarantines what a cask stages, these binaries carry only the ad-hoc signature
# the linker applies, so Gatekeeper killed the first run unless the cask cleared
# the attribute — and the `/usr/bin/xattr` call that cleared it does not exist on
# Linux, where the cask DSL's raising `system_command` then failed the install.
# Nothing quarantines what a formula installs.
#
# The consequence here: publishing a release is the whole job, and the release
# needs write access to nothing but this repository.

changelog:
  disable: true
