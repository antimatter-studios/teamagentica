name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-changes:
    name: check changes
    runs-on: ubuntu-latest
    outputs:
      tacli: ${{ steps.check.outputs.tacli }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Diff against previous tag
        id: check
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "tacli=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV_TAG"..HEAD -- tacli/ .goreleaser.yml | grep -q .; then
            echo "tacli=true" >> "$GITHUB_OUTPUT"
          else
            echo "tacli=false" >> "$GITHUB_OUTPUT"
          fi

  tacli-release:
    name: tacli release
    needs: check-changes
    if: needs.check-changes.outputs.tacli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: tacli/go.sum

      - name: Generate tacli changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" "$PREV_TAG"..HEAD -- tacli/ .goreleaser.yml \
              | grep -vE '^(\* (docs|test|ci|chore)[(:])' > /tmp/changelog.md || true
          else
            git log --pretty=format:"* %s (%h)" HEAD -- tacli/ .goreleaser.yml \
              | grep -vE '^(\* (docs|test|ci|chore)[(:])' > /tmp/changelog.md || true
          fi
          # fallback if empty
          [ -s /tmp/changelog.md ] || echo "* Maintenance release" > /tmp/changelog.md

      # `~> v2` floats to the newest v2.x, and goreleaser removes deprecated
      # configuration in minor releases — so a release could break with no change
      # to this repository and no warning. Bounding it to the 2.17 series still
      # picks up patch fixes, and moving to a new minor becomes a deliberate edit
      # that CI validates first.
      #
      # Not pinned to an exact patch: dependabot updates `uses:` refs but not an
      # action's `version` input, so an exact pin would go stale unnoticed.
      #
      # No tap token: the release no longer writes into the Homebrew tap, so it
      # needs no credential for any repository but this one. The secret itself can
      # be deleted from this repository's settings.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2.17"
          args: release --clean --release-notes /tmp/changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
